name: Clean-Machine Restore

# THE HOST IS GONE. What an operator has left is what they kept off it: the
# backup files and the .env. This drill takes those from one runner that ran
# the PREVIOUS release, and brings the CURRENT release back from them on a
# second runner that has never run this stack - then measures how long that
# took, from the first command on the empty machine to the application
# answering with the data it had. The ordinary deployment verification restores
# on the same host and the same version; this is the case it cannot reach.
on:
  schedule:
    - cron: "40 4 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/dr-drill.sh"
      - ".github/workflows/dr-drill.yml"

permissions:
  contents: read

concurrency:
  group: dr-drill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  before:
    name: The host that dies runs the previous release and is backed up
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NETWORK_ONE: dozzle-network
      NETWORK_TWO: traefik-network
      DOCKER_COMPOSE_FILE: dozzle-traefik-letsencrypt-docker-compose.yml
      APP_HOSTNAME: dozzle.heyvaldemardm.net
      APP_TRAEFIK_HOSTNAME: traefik.dozzle.heyvaldemardm.net
      COMPOSE_PROJECT_NAME: dozzle
      APP_URL: "https://$APP_HOSTNAME/login"
      APP_OK: "200"
      DB_ENGINE: ""
      DB_HOST: ""
      DB_NAME_ENV: ""
      DB_USER_ENV: ""
      DB_PASS_ENV: ""
      DB_DIR_ENV: ""
      DATA_DIR_ENV: "DATA_BACKUPS_PATH"
      DATA_PATH_ENV: "DATA_PATH"
      DB_FILE_MATCH: ""
      DATA_FILE_MATCH: ""
      DB_RESTORE: ""
      DATA_RESTORE: "./dozzle-restore-data.sh \"$F\""
      DR_DIAG: ""
      DR_IGNORE_SERVICES: ""
      DR_KEEP: ""
      DR_APP_WAIT: ""
      DATA_MARK_SUBDIR: ""
      BACKUPS_SVC: ""
      EXTRA_DB_SVC: ""
      EXTRA_DB_DIR_ENV: ""
      EXTRA_DB_FILE_MATCH: ""
      EXTRA_DB_RESTORE: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The release this host was running
        # The newest release whose stack differs from main's, so the restore
        # below crosses a version: an old backup brought back into the release
        # that replaced it. Picking by tag order alone chose main's own release
        # whenever main carried a commit that did not touch the stack, and the
        # first run "crossed" from v1.9.1 to v1.9.1. A template whose every
        # release runs the same stack drills its newest one: the host is still
        # gone, and the page says from and to plainly.
        run: |
          from=""
          for t in $(git tag --sort=-v:refname --list 'v*'); do
            if ! git diff --quiet "$t" HEAD -- $DOCKER_COMPOSE_FILE; then from="$t"; break; fi
          done
          [ -n "$from" ] || from="$(git tag --sort=-v:refname --list 'v*' | head -n 1)"
          [ -n "$from" ] || { echo "::error::no release to take the backup on"; exit 1; }
          echo "DR_FROM=$from" >> "$GITHUB_ENV"
          echo "the backup is taken on $from"

      - name: Create necessary Docker networks
        run: |
          docker network create "$NETWORK_ONE" || true
          docker network create "$NETWORK_TWO" || true

      - name: Generate the admin password hash with the documented command
        # Not a shortcut for CI: this is the exact command the README gives a
        # deployer, and running it here is how that instruction stays true. If
        # upstream changes the generator's flags or its output, this step is
        # what notices, rather than somebody following a stale README.
        id: hash
        env:
          DOZZLE_TEST_USER: citest
          DOZZLE_TEST_PASSWORD: ci-test-password-not-a-secret
        run: |
          image="$(grep -m1 -oE '\$\{DOZZLE_IMAGE_TAG:-.*' dozzle-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          out="$(docker run --rm "$image" generate --name "CI" --email ci@example.com \
                   --password "$DOZZLE_TEST_PASSWORD" "$DOZZLE_TEST_USER")"
          echo "$out"
          hash="$(printf '%s' "$out" | grep -m1 'password:' | sed 's/.*password: //')"
          # The bcrypt prefixes are literals, not expansions.
          # shellcheck disable=SC2016
          case "$hash" in
            '$2a$'*|'$2b$'*|'$2y$'*) ;;
            *) echo "::error::the generator did not return a bcrypt hash: ${hash:-nothing}"; exit 1 ;;
          esac
          # Doubled for Compose interpolation, exactly as the README says.
          echo "hash=$(printf '%s' "$hash" | sed 's/\$/$$/g')" >> "$GITHUB_OUTPUT"

      - name: Generate test .env with ephemeral credentials
        env:
          DOZZLE_TEST_USER: citest
          ADMIN_HASH: ${{ steps.hash.outputs.hash }}
        # The real .env is gitignored. CI generates throwaway credentials so
        # `docker compose up` succeeds without committing secrets to the
        # repo. No *_IMAGE_TAG values on purpose: the compose file's
        # x-images defaults apply, so CI always tests exactly the pins the
        # template ships to users who run it unmodified.
        run: |
          cat > .env <<EOF
          TRAEFIK_ACME_EMAIL=ci@example.com
          TRAEFIK_HOSTNAME=${APP_TRAEFIK_HOSTNAME}
          TRAEFIK_BASIC_AUTH=traefikadmin:\$\$2y\$\$10\$\$sMzJfirKC75x/hVpiINeZOiSm.Jkity9cn4KwNkRvO7hSQVFc5FLO
          DOZZLE_HOSTNAME=${APP_HOSTNAME}
          BACKUP_INIT_SLEEP=15s
          BACKUP_INTERVAL=60s
          EOF
          # The credentials are appended with printf rather than written in the
          # heredoc above, and that is not a style choice. The heredoc is
          # unquoted so ${APP_HOSTNAME} expands - and in an unquoted heredoc a
          # literal $$ is THE SHELL'S PID, not two dollars. The hash arrives
          # here with every $ doubled for Compose, so `$2a$11$…` came out as
          # `24972a2497112497…` and Dozzle refused the password against a
          # user file that looked plausible. printf %s interprets nothing.
          printf 'DOZZLE_ADMIN_USERNAME=%s\n' "$DOZZLE_TEST_USER" >> .env
          printf 'DOZZLE_ADMIN_PASSWORD_HASH=%s\n' "$ADMIN_HASH" >> .env
          grep -c '^DOZZLE_ADMIN_PASSWORD_HASH=[$][$]2[aby][$]' .env > /dev/null \
            || { echo "::error::the hash was not written as a doubled bcrypt value: $(grep '^DOZZLE_ADMIN_PASSWORD_HASH=' .env | cut -c1-60)"; exit 1; }
          echo "Generated ephemeral .env for CI run"
      - name: Modify /etc/hosts for internal routing
        run: |
          echo "127.0.0.1 $APP_HOSTNAME" | sudo tee -a /etc/hosts
          echo "127.0.0.1 $APP_TRAEFIK_HOSTNAME" | sudo tee -a /etc/hosts
      - name: Run the previous release, write the markers, take the backup
        run: ./tests/dr-drill.sh before

      - name: Keep only what an operator keeps off the host
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dr-offsite
          path: dr-out
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

      - name: Show container logs on failure
        if: failure()
        run: docker compose $(for f in .dr-from-*.yml; do printf ' -f %s' "$f"; done) -p "$COMPOSE_PROJECT_NAME" logs --tail 200 || true

  after:
    name: A clean machine brings the current release back from those files
    needs: before
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NETWORK_ONE: dozzle-network
      NETWORK_TWO: traefik-network
      DOCKER_COMPOSE_FILE: dozzle-traefik-letsencrypt-docker-compose.yml
      APP_HOSTNAME: dozzle.heyvaldemardm.net
      APP_TRAEFIK_HOSTNAME: traefik.dozzle.heyvaldemardm.net
      COMPOSE_PROJECT_NAME: dozzle
      APP_URL: "https://$APP_HOSTNAME/login"
      APP_OK: "200"
      DB_ENGINE: ""
      DB_HOST: ""
      DB_NAME_ENV: ""
      DB_USER_ENV: ""
      DB_PASS_ENV: ""
      DB_DIR_ENV: ""
      DATA_DIR_ENV: "DATA_BACKUPS_PATH"
      DATA_PATH_ENV: "DATA_PATH"
      DB_FILE_MATCH: ""
      DATA_FILE_MATCH: ""
      DB_RESTORE: ""
      DATA_RESTORE: "./dozzle-restore-data.sh \"$F\""
      DR_DIAG: ""
      DR_IGNORE_SERVICES: ""
      DR_KEEP: ""
      DR_APP_WAIT: ""
      DATA_MARK_SUBDIR: ""
      BACKUPS_SVC: ""
      EXTRA_DB_SVC: ""
      EXTRA_DB_DIR_ENV: ""
      EXTRA_DB_FILE_MATCH: ""
      EXTRA_DB_RESTORE: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create necessary Docker networks
        run: |
          docker network create "$NETWORK_ONE" || true
          docker network create "$NETWORK_TWO" || true

      - name: Generate the admin password hash with the documented command
        # Not a shortcut for CI: this is the exact command the README gives a
        # deployer, and running it here is how that instruction stays true. If
        # upstream changes the generator's flags or its output, this step is
        # what notices, rather than somebody following a stale README.
        id: hash
        env:
          DOZZLE_TEST_USER: citest
          DOZZLE_TEST_PASSWORD: ci-test-password-not-a-secret
        run: |
          image="$(grep -m1 -oE '\$\{DOZZLE_IMAGE_TAG:-.*' dozzle-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          out="$(docker run --rm "$image" generate --name "CI" --email ci@example.com \
                   --password "$DOZZLE_TEST_PASSWORD" "$DOZZLE_TEST_USER")"
          echo "$out"
          hash="$(printf '%s' "$out" | grep -m1 'password:' | sed 's/.*password: //')"
          # The bcrypt prefixes are literals, not expansions.
          # shellcheck disable=SC2016
          case "$hash" in
            '$2a$'*|'$2b$'*|'$2y$'*) ;;
            *) echo "::error::the generator did not return a bcrypt hash: ${hash:-nothing}"; exit 1 ;;
          esac
          # Doubled for Compose interpolation, exactly as the README says.
          echo "hash=$(printf '%s' "$hash" | sed 's/\$/$$/g')" >> "$GITHUB_OUTPUT"

      - name: Generate test .env with ephemeral credentials
        env:
          DOZZLE_TEST_USER: citest
          ADMIN_HASH: ${{ steps.hash.outputs.hash }}
        # The real .env is gitignored. CI generates throwaway credentials so
        # `docker compose up` succeeds without committing secrets to the
        # repo. No *_IMAGE_TAG values on purpose: the compose file's
        # x-images defaults apply, so CI always tests exactly the pins the
        # template ships to users who run it unmodified.
        run: |
          cat > .env <<EOF
          TRAEFIK_ACME_EMAIL=ci@example.com
          TRAEFIK_HOSTNAME=${APP_TRAEFIK_HOSTNAME}
          TRAEFIK_BASIC_AUTH=traefikadmin:\$\$2y\$\$10\$\$sMzJfirKC75x/hVpiINeZOiSm.Jkity9cn4KwNkRvO7hSQVFc5FLO
          DOZZLE_HOSTNAME=${APP_HOSTNAME}
          BACKUP_INIT_SLEEP=15s
          BACKUP_INTERVAL=60s
          EOF
          # The credentials are appended with printf rather than written in the
          # heredoc above, and that is not a style choice. The heredoc is
          # unquoted so ${APP_HOSTNAME} expands - and in an unquoted heredoc a
          # literal $$ is THE SHELL'S PID, not two dollars. The hash arrives
          # here with every $ doubled for Compose, so `$2a$11$…` came out as
          # `24972a2497112497…` and Dozzle refused the password against a
          # user file that looked plausible. printf %s interprets nothing.
          printf 'DOZZLE_ADMIN_USERNAME=%s\n' "$DOZZLE_TEST_USER" >> .env
          printf 'DOZZLE_ADMIN_PASSWORD_HASH=%s\n' "$ADMIN_HASH" >> .env
          grep -c '^DOZZLE_ADMIN_PASSWORD_HASH=[$][$]2[aby][$]' .env > /dev/null \
            || { echo "::error::the hash was not written as a doubled bcrypt value: $(grep '^DOZZLE_ADMIN_PASSWORD_HASH=' .env | cut -c1-60)"; exit 1; }
          echo "Generated ephemeral .env for CI run"
      - name: Modify /etc/hosts for internal routing
        run: |
          echo "127.0.0.1 $APP_HOSTNAME" | sudo tee -a /etc/hosts
          echo "127.0.0.1 $APP_TRAEFIK_HOSTNAME" | sudo tee -a /etc/hosts
      - name: The files kept off the dead host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dr-offsite
          path: dr-out

      - name: Restore on the clean machine, and time it
        run: ./tests/dr-drill.sh after

      - name: Keep the measured result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dr-result
          path: dr-result.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: docker compose $(for f in $DOCKER_COMPOSE_FILE; do printf ' -f %s' "$f"; done) -p "$COMPOSE_PROJECT_NAME" logs --tail 200
